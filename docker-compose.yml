services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: frostguard
      MYSQL_USER: frostguard
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a high-entropy MYSQL_PASSWORD in .env.compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a high-entropy MYSQL_ROOT_PASSWORD in .env.compose}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    restart: "no"
    environment: &api-environment
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 4000
      API_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the browser-facing origin}
      WEB_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the browser-facing origin}
      DATABASE_URL: mysql://frostguard:${MYSQL_PASSWORD}@mysql:3306/frostguard
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set a unique JWT_ACCESS_SECRET}
      DEVICE_HMAC_SECRET: ${DEVICE_HMAC_SECRET:?Set a unique DEVICE_HMAC_SECRET}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?Set a unique non-default SEED_DEMO_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
      - frontend

volumes:
  mysql-data:

networks:
  backend:
    internal: true
  # The Nginx web container needs a routable interface for the published
  # localhost port; it also joins backend so /api and /socket.io can reach API.
  frontend: {}
